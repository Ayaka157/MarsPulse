<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0A0E17; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;

.top-accent { width: 100%; height: 6pt; background: #E8612A; }

h1 { color: #FFFFFF; font-size: 28pt; margin: 0 0 8pt 0; line-height: 1.2; }
.subtitle { color: #B0B8C0; font-size: 11pt; margin: 6pt 0 3pt 0; }
.info { color: #8899AA; font-size: 9pt; margin: 12pt 0 0 0; }
.team { color: #BBC8D4; font-size: 10pt; margin: 2pt 0; }
.tag { color: #E8612A; font-size: 9pt; margin: 8pt 0 0 0; font-weight: bold; }
.img-box { width: 220pt; height: 160pt; background: #1A2740; border: 1pt solid #2A3A50; border-radius: 6pt; display: flex; align-items: center; justify-content: center; }
.img-box p { color: #556677; font-size: 8pt; }

</head>
<body>
<div class="top-accent"></div>
<div class="main">
  <div class="left">
    <h1>MarsPulse</h1>

    <p class="info">2026全国青少年航天创新大赛 | 镜平学校（中学部）</p>
    <p class="team">曾皓轩 · 毛元君 · 陈凯熙 | 指导教师：蔡镖</p>

  <div id="img-cover" class="placeholder" style="width: 230pt; height: 180pt;"></div>
