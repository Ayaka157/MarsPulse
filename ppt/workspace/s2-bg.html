<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0A0E17; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  display: flex; flex-direction: column;
  background: #0A0E17; font-family: Arial, sans-serif;
}
.top-accent { width: 100%; height: 4pt; background: #E8612A; }
.content { flex: 1; margin: 20pt 40pt 15pt 40pt; }
h2 { color: #FFFFFF; font-size: 22pt; margin: 0 0 10pt 0; }
h3 { color: #E8612A; font-size: 13pt; margin: 12pt 0 5pt 0; }
p { color: #B0B8C0; font-size: 10pt; margin: 4pt 0; line-height: 1.5; }
b { color: #FF9A5C; }
</style>
</head>
<body>
<div class="top-accent"></div>
<div class="content">
  <h2>研究背景</h2>
  <h3>为什么选火星熔岩管？</h3>
  <p>火星地表辐射强、温差大。地下<b>熔岩管</b>是天然防辐射恒温庇护所——几米岩层挡掉90%辐射，10-20米深处恒温−20°C。</p>
  <h3>沙尘暴的威胁</h3>
  <p>沙尘暴可持续两三个月，遮阳断电，无线电衰减导致<b>地火通讯完全中断</b>。</p>
  <h3>现在的做法有什么问题？</h3>
  <p>目前航天器用<b>静态规则</b>（先保命→再供暖→最后实验），致命缺陷是<b>不会提前做准备</b>，等到没电才反应。</p>
</div>
</body>
</html>
