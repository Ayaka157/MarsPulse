<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0A0E17; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  display: flex; flex-direction: column;
  background: #0A0E17; font-family: Arial, sans-serif;
}
.top-accent { width: 100%; height: 4pt; background: #E8612A; }
.main { flex: 1; display: flex; margin: 12pt 30pt 8pt 30pt; gap: 15pt; }
.left { width: 310pt; }
h2 { color: #FFFFFF; font-size: 20pt; margin: 0 0 6pt 0; }
h3 { color: #E8612A; font-size: 11pt; margin: 6pt 0 3pt 0; }
p { color: #B0B8C0; font-size: 9pt; margin: 2pt 0; line-height: 1.5; }
b { color: #FF9A5C; }
.quote { color: #2AA9C9; font-size: 10pt; margin: 5pt 0; }
table { border-collapse: collapse; margin: 5pt 0; width: 100%; }
td, th { color: #B0B8C0; font-size: 9pt; padding: 5pt 6pt; border: 0.5pt solid #2A3A50; }
th { background: #1A2740; color: #FF9A5C; }
.accent { color: #FF9A5C; }
.right { width: 350pt; display: flex; align-items: center; justify-content: center; }
.img-box { width: 340pt; height: 220pt; background: #1A2740; border: 1pt solid #2A3A50; border-radius: 4pt; }
</style>
</head>
<body>
<div class="top-accent"></div>
<div class="main">
  <div class="left">
    <h2>总教练有多重要？</h2>
    <h3>消融实验——把总教练拿掉</h3>
    <table>
      <tr><th>方案</th><th>生存</th><th>死亡率</th><th>解释</th></tr>
      <tr><td>传统规则</td><td>114天</td><td>92%</td><td>基线</td></tr>
      <tr><td>一个AI管全部</td><td>2.5天</td><td>100%</td><td>顾此失彼</td></tr>
      <tr><td>三个AI没总教练</td><td>2.4天</td><td>100%</td><td>抢电池全死</td></tr>
      <tr><td><b>三个AI+总教练</b></td><td><b>130天</b></td><td><b>70%</b></td><td>协调配合</td></tr>
    </table>
    <p>拿掉总教练，三个AI像<b>三人抢一个充电宝</b>，几小时抢光。</p>
    <p class="quote">总教练贡献：+127.3天，54倍提升。长期任务中AI配合不是量变是质变——<b>没有配合就活不下去</b>。</p>
  </div>
  <div class="right">
    <div id="img-6" class="placeholder" style="width: 340pt; height: 230pt;"></div>
  </div>
</div>
</body>
</html>
